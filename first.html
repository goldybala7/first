<!--animation.html-->
<html>
    <head>
        <title>Animation Example</title>
        <!-- <script src="https://aframe.io/releases/0.6.0/aframe.min.js"></script> -->
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>

    <body>
        <a-scene>
            <a-box position="0 1.6 -5" color="yellow" rotation="0 45 20">
                <a-animation attribute="scale" to="3 3 2" dur="2000" direction="alternate"  repeat="8"></a-animation>
            </a-box>

            <a-cylinder position="2 1.6 -5" color="blue" radius="0.5" height="2">
                <a-animation attribute="position" to="2 3 -5" dur="2000" direction="alternate" repeat="3"></a-animation>
            </a-cylinder>
            <a-sphere position="-2 1.6 -5" color="red">
                <a-animation attribute="scale" to="2 1 1" dur="20000" direction="alternate" repeat="3"></a-animation>
            </a-sphere> 

             <a-box position="0 1.6 -5" rotation="0 45 0" scale="1 1 1" animation="property: scale; to: 1 3 -6; dur: 2000; easing: linear; loop: true" color="tomato"></a-box> 

            <a-box position="2 1.6 -5" rotation="0 90 0" scale="8 4 2" color="red"></a-box> 
            
           <!-- <a-text position="0 3 -5" value="Hello, A-Frame!" color="black"></a-text> -->
        </a-scene>
    </body>

</html>
